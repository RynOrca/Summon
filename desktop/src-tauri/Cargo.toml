[package]
name = "summon-desktop"
version = "0.1.0"
description = "Reed 一苇 — lightweight learning agent"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-runtime = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
