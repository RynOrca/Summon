<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost;">
  <title>Summon</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <span class="app-mark" aria-hidden="true">✳</span>
      <div class="chat-title"><strong>Summon</strong><span id="model-label">PI Agent</span></div>
      <button id="settings-button" class="chrome-button" title="模型设置" aria-label="模型设置">⚙</button>
      <button id="hide-button" class="chrome-button" title="隐藏窗口" aria-label="隐藏窗口">−</button>
    </header>
    <main id="transcript" class="thread-scroll" aria-live="polite">
      <div id="empty-state" class="empty-state"><span class="empty-icon">✳</span><h1>有什么可以帮你？</h1><p>由 PI Agent 驱动的独立对话窗口</p></div>
      <div id="messages" class="transcript-list"></div>
    </main>
    <div class="composer-dock composer-dock-docked">
      <form id="composer" class="composer-stack">
        <div class="composer-shell">
          <div class="composer-input-wrap"><textarea id="prompt" class="composer-input" rows="1" placeholder="向 PI 提问…" aria-label="消息"></textarea></div>
          <div class="composer-toolbar"><span id="status" class="composer-status">正在连接…</span><button id="stop-button" type="button" class="stop-button" hidden>停止</button><button id="send-button" class="send-btn" type="submit" aria-label="发送">↑</button></div>
        </div>
      </form>
    </div>
  </div>
  <dialog id="settings" class="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="settings-head"><h2>模型设置</h2><button id="settings-close" type="button" class="chrome-button" aria-label="关闭">×</button></div>
      <p>API Key 只保留在当前 Agent 进程内。会话保存在 Summon 自己的数据目录。</p>
      <label>提供商<input id="provider" autocomplete="off" spellcheck="false" placeholder="anthropic"></label>
      <label>API Key<input id="api-key" type="password" autocomplete="off" placeholder="输入 API Key"></label>
      <button id="save-key" class="settings-action" type="button">应用 Key 并刷新模型</button>
      <label>模型<select id="model-picker"><option value="">自动选择</option></select></label>
      <button id="select-model" class="settings-action" type="button">使用此模型</button>
      <div id="settings-error" role="alert"></div>
    </form>
  </dialog>
</body>
</html>
