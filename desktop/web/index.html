<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost;">
  <title>Summon</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-new" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2.5a.75.75 0 0 1 .75.75v4h4a.75.75 0 0 1 0 1.5h-4v4a.75.75 0 0 1-1.5 0v-4h-4a.75.75 0 0 1 0-1.5h4v-4A.75.75 0 0 1 8 2.5Z"/></symbol>
    <symbol id="icon-history" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2.5a5.5 5.5 0 1 0 5.27 6.98.7.7 0 0 1 1.35.38A7 7 0 1 1 10.6 3.4l1.2-1.2a.7.7 0 1 1 .99.99l-1.9 1.9a.7.7 0 0 1-.99 0L8 3.12A5.47 5.47 0 0 0 8 2.5Zm-.3 2.7a.65.65 0 0 1 1.3 0V8l1.87 1.08a.65.65 0 1 1-.65 1.13L8.05 8.8a.65.65 0 0 1-.35-.57V5.2Z"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 16 16"><path fill="currentColor" d="m8 1.5 1.45 5.05L14.5 8l-5.05 1.45L8 14.5 6.55 9.45 1.5 8l5.05-1.45L8 1.5Z"/></symbol>
    <symbol id="icon-role" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M2 8s2.2-3.5 6-3.5S14 8 14 8s-2.2 3.5-6 3.5S2 8 2 8Z"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 16 16"><path fill="currentColor" d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Zm0 1.3a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2ZM6.5 1.7h3l.3 1.3.8.4 1.2-.6 1.5 2.6-1 .9v1l1 .9-1.5 2.6-1.2-.6-.8.4-.3 1.3h-3l-.3-1.3-.8-.4-1.2.6-1.5-2.6 1-.9v-1l-1-.9 1.5-2.6 1.2.6.8-.4.3-1.3Z"/></symbol>
    <symbol id="icon-hide" viewBox="0 0 16 16"><path fill="currentColor" d="M3 7.25h10v1.5H3z"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m4.5 6 3.5 3.5L11.5 6"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 16 16"><path fill="currentColor" d="M2 4.25C2 3.56 2.56 3 3.25 3h2.14c.4 0 .78.19 1.02.51l.72.99h5.62c.69 0 1.25.56 1.25 1.25v5.5c0 .69-.56 1.25-1.25 1.25H3.25C2.56 12.5 2 11.94 2 11.25V4.25Z"/></symbol>
    <symbol id="icon-send" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M8 13V3m0 0L4.4 6.6M8 3l3.6 3.6"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 16 16"><rect fill="currentColor" x="4.5" y="4.5" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-close" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="m4 4 8 8m0-8-8 8"/></symbol>
  </svg>
  <div class="chat-shell">
    <header class="chat-header" data-drag-region>
      <div class="header-primary">
        <button id="header-new-chat" class="icon-button" type="button" title="新对话" aria-label="新对话"><svg><use href="#icon-new"/></svg></button>
        <button id="history-button" class="icon-button" type="button" title="对话历史" aria-label="对话历史"><svg><use href="#icon-history"/></svg></button>

      </div>
      <div class="drag-space" title="拖动窗口" aria-label="拖动窗口"></div>
      <div class="header-actions">
        <button id="activity-button" class="icon-button" type="button" title="工具与思考记录" aria-label="工具与思考记录"></button>
        <button id="settings-button" class="icon-button" type="button" title="设置" aria-label="设置"><svg><use href="#icon-settings"/></svg></button>
        <button id="hide-button" class="icon-button" type="button" title="隐藏到托盘" aria-label="隐藏到托盘"></button>


      </div>
    </header>
    <main class="chat-body">
      <div id="transcript" class="thread-scroll" aria-live="polite">
        <div id="empty-state" class="empty-state"><svg><use href="#icon-spark"/></svg><h1>有什么可以帮你？</h1><p>从这里开始一段新对话</p></div>
        <div id="messages" class="transcript-list"></div>
      </div>
    </main>
    <div class="status-line"><span class="status-pulse" aria-hidden="true"></span><span id="status" class="composer-status">正在连接…</span></div>
    <div class="composer-dock">
      <div id="queue-preview" class="queue-preview" hidden><div id="queue-items"></div><button id="clear-queue" type="button">取消待处理消息</button></div>
      <form id="composer" class="composer-stack">
        <div class="composer-shell"><div class="fade-band" aria-hidden="true"></div>
          <input id="attachment-picker" type="file" multiple hidden>
          <div id="attachment-strip" class="attachment-strip" hidden></div>
          <div class="composer-input-wrap"><textarea id="prompt" class="composer-input" rows="2" placeholder="问点什么…" aria-label="消息"></textarea></div>
          <div class="composer-toolbar">
            <select id="message-mode" class="message-mode" aria-label="生成中新消息处理方式" hidden><option value="steer">引导</option><option value="followUp">队列</option></select>
            <button id="add-image" class="attachment-button" type="button" title="添加文件或图片" aria-label="添加文件或图片"><svg><use href="#icon-new"/></svg></button>
            <button id="workspace-button" class="workspace-chip" type="button" title="切换工作目录"><svg><use href="#icon-folder"/></svg><span id="workspace-label">工作目录</span></button>
      <div class="composer-configuration">
        <button id="model-button" class="model-chip" type="button" title="选择模型"><svg><use href="#icon-spark"/></svg><span class="compact-button-label">Model</span><span id="model-label">选择模型</span><span id="model-thinking" hidden></span><svg class="chip-chevron"><use href="#icon-chevron"/></svg></button>
        <button id="role-button" class="model-chip role-chip" type="button" title="角色预设"><svg><use href="#icon-role"/></svg><span class="compact-button-label">Role</span><span id="role-label">Agent</span><svg class="chip-chevron"><use href="#icon-chevron"/></svg></button>
      </div>
            <span class="composer-spacer"></span>
            <span id="token-speed" class="token-speed" title="服务端输出 token / 模型生成时段（含思考和首 token 等待，不含工具等待）">— tok/s</span>
            <button id="context-usage" class="context-usage" type="button" aria-label="查看上下文占用" title="上下文占用未知"><svg viewBox="0 0 32 32"><circle class="context-track" cx="16" cy="16" r="12"/><circle id="context-arc" class="context-arc" cx="16" cy="16" r="12" stroke-dasharray="0 75.4"/></svg><span id="context-percent">?</span></button>
            <button id="stop-button" type="button" class="stop-button" title="停止生成" aria-label="停止生成" hidden><svg><use href="#icon-stop"/></svg></button>
            <button id="send-button" class="send-btn" type="submit" title="发送" aria-label="发送" disabled><svg><use href="#icon-send"/></svg></button>
          </div>
        </div>
      </form>
    </div>
    <div id="history-overlay" class="history-overlay" hidden></div>
    <aside id="history-drawer" class="history-drawer" aria-label="对话历史" hidden>
      <div class="history-head"><strong>对话历史</strong><button id="history-close" class="icon-button" type="button" title="关闭历史" aria-label="关闭历史"><svg><use href="#icon-close"/></svg></button></div>
      <button id="history-new-chat" class="history-new" type="button"><svg><use href="#icon-new"/></svg>新对话</button>
      <button id="history-rename" class="history-rename" type="button">重命名当前对话</button>
      <button id="history-archives" class="history-rename" type="button">查看已归档</button><div id="history-list" class="history-list"></div>
      <p id="history-error" class="history-error" role="alert" hidden></p>
    </aside>
  </div>

  <dialog id="rename-dialog" class="settings-dialog">
    <div class="settings-head"><h2>重命名对话</h2><button id="rename-close" type="button" class="chrome-button" aria-label="关闭">×</button></div>
    <label>对话名称<input id="rename-name" maxlength="100" autocomplete="off"></label>
    <button id="rename-save" class="settings-action" type="button">保存名称</button>
    <p id="rename-error" class="history-error" role="alert" hidden></p>
  </dialog>
  <dialog id="roles-dialog" class="settings-dialog roles-dialog">
    <div class="settings-head"><h2>角色预设</h2><button id="roles-close" type="button" class="chrome-button" aria-label="关闭">×</button></div>
    <p>选中角色后会开启新对话。角色说明会加入 Agent 的系统提示词。</p>
    <div id="roles-list" class="roles-list"></div>
    <button id="roles-new" class="settings-action" type="button">新建角色</button>
    <div id="role-editor" hidden>
      <label>角色名称<input id="role-name" maxlength="60" placeholder="例如：翻译官"></label>
      <label>角色说明<textarea id="role-system" maxlength="20000" rows="6" placeholder="描述角色的语气、任务和回复规则"></textarea></label>
      <div class="role-editor-actions"><button id="role-cancel" type="button">取消</button><button id="role-save" class="settings-action" type="button">保存角色</button></div>
    </div>
    <p id="role-error" class="history-error" role="alert" hidden></p>
  </dialog>

<dialog id="activity-dialog" class="settings-dialog activity-dialog"><div class="settings-head"><h2>工具与思考记录</h2><button id="activity-close" class="chrome-button" aria-label="关闭">×</button></div><p>点开记录查看参数、结果、审批与模型返回的思考内容。</p><div id="activity-list"></div></dialog>
<dialog id="context-dialog" class="settings-dialog"><div class="settings-head"><h2>上下文占用</h2><button id="context-close" class="chrome-button" aria-label="关闭">×</button></div><p id="context-detail">模型尚未提供上下文信息。</p><p id="compaction-state"></p><button id="compact-now" class="settings-action" type="button">压缩当前上下文</button><p class="context-explanation">根据最近一次模型用量与当前消息估算。不是所有历史对话的累计 token；服务未提供容量时不显示百分比。速度包含输出与思考 token，不含工具等待时间。</p></dialog>
<dialog id="models-dialog" class="settings-dialog models-dialog">
  <div class="settings-head"><h2 id="model-step-title">选择模型</h2><button id="models-close" class="chrome-button" aria-label="关闭">×</button></div>
  <div id="model-step"><input id="model-search" placeholder="搜索模型或提供商" aria-label="搜索模型">
  <div id="model-list" class="model-list"></div>
  <button id="configure-models" class="settings-action">配置提供商</button></div>
  <div id="thinking-step" hidden><h3 id="chosen-model-name"></h3><p id="chosen-model-info"></p><label>思考档位<select id="thinking-level" aria-label="思考档位"></select></label><p id="thinking-hint"></p><div class="model-step-actions"><button id="model-back" type="button">返回模型列表</button><button id="model-apply" type="button" class="settings-action">确认应用</button></div></div>
  <p id="model-error" role="alert" hidden></p>
</dialog></body>
</html>
