<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summon Chat 角色</title>
    <style>
      /* A docked work-panel view: no window chrome, so --pi-plugin-titlebar-height
         is 0px here. `color-scheme` makes native <select> popups render dark. */
      :root {
        color-scheme: dark;
        --bg: #14171d;
        --bg-2: #1a1e26;
        --fg: #e8ebf1;
        --muted: #98a2b3;
        --line: #262c37;
        --accent: #6ea8ff;
        --warn: #fbbf24;
        --err: #f87171;
        --ok: #4ade80;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --bg-2: #f6f7f9;
          --fg: #1a1f28;
          --muted: #5b6675;
          --line: #e4e8ee;
          --accent: #2563eb;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg); color: var(--fg);
        font: 13px/1.55 ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .rc-root {
        height: 100%; overflow-y: auto;
        padding: calc(var(--pi-plugin-titlebar-height, 0px) + 12px) 16px 28px;
      }
      .rc-page { max-width: 860px; }

      /* ---- list page ---- */
      .rc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .rc-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
      .rc-head .sp { flex: 1 1 auto; }
      .rc-rows { display: flex; flex-direction: column; gap: 6px; }
      .rc-row {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
        background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px;
        padding: 10px 12px; cursor: pointer; color: var(--fg);
      }
      .rc-row:hover { border-color: var(--accent); }
      .rc-row .nm { font-size: 13.5px; font-weight: 500; }
      .rc-row .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
      .rc-row .grow { flex: 1 1 auto; min-width: 0; }
      .rc-badge {
        font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
        border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto;
      }
      .rc-badge.def { border-color: var(--ok); color: var(--ok); }

      /* ---- edit page ---- */
      .rc-back {
        background: transparent; border: 1px solid var(--line); color: var(--fg);
        border-radius: 7px; padding: 4px 10px; cursor: pointer; font: inherit;
      }
      .rc-back:hover { border-color: var(--accent); color: var(--accent); }
      .rc-field { margin-bottom: 16px; }
      .rc-field > label {
        display: block; font-size: 11.5px; color: var(--muted);
        text-transform: uppercase; letter-spacing: .03em; margin-bottom: 5px;
      }
      input[type="text"], textarea, select {
        width: 100%; font: inherit; color: var(--fg); background: var(--bg);
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      }
      option { background: var(--bg-2); color: var(--fg); }
      /* The whole point of this page: room to actually write a prompt. */
      textarea.prompt {
        min-height: 340px; resize: vertical; line-height: 1.6;
        font: 12.5px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      input:focus-visible, textarea:focus-visible, select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 1px;
      }
      input:disabled, textarea:disabled, select:disabled { opacity: .6; }
      .rc-hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
      .rc-checks { display: flex; flex-wrap: wrap; gap: 12px; }
      .rc-check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
      .rc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
      .rc-chip {
        display: inline-flex; align-items: center; gap: 5px;
        border: 1px solid var(--line); border-radius: 999px;
        padding: 2px 4px 2px 10px; font-size: 12px;
      }
      .rc-chip button {
        border: 0; background: transparent; color: var(--muted);
        cursor: pointer; font-size: 13px; line-height: 1; padding: 0 3px;
      }
      .rc-chip button:hover { color: var(--err); }
      .rc-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .rc-inline input[type="text"] { max-width: 260px; }
      button.btn {
        font: inherit; color: var(--fg); background: transparent;
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer;
      }
      button.btn:hover { border-color: var(--accent); color: var(--accent); }
      button.btn.primary { border-color: var(--accent); color: var(--accent); }
      button.btn.danger:hover { border-color: var(--err); color: var(--err); }
      button.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); color: var(--muted); }
      .rc-actions {
        display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
        position: sticky; bottom: -28px; padding: 12px 0 4px;
        background: linear-gradient(to top, var(--bg) 70%, transparent);
      }
      .rc-banner {
        border: 1px solid var(--line); border-left: 3px solid var(--warn);
        border-radius: 8px; padding: 9px 12px; margin-bottom: 14px; font-size: 12.5px;
        background: var(--bg-2);
      }
      .rc-banner.err { border-left-color: var(--err); }
      .rc-banner.ok { border-left-color: var(--ok); }
      .rc-banner ul { margin: 5px 0 0; padding-left: 18px; color: var(--muted); }
      .rc-empty { color: var(--muted); font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div class="rc-root">
      <div class="rc-page" id="page"></div>
    </div>

    <script>
      (function () {
        var bridge = window.pluginBridge;
        var page = document.getElementById("page");

        // Phase 3 provides the implementation; the editor can already author it.
        var KNOWN_TOOLS = [{ id: "web_search", label: "联网搜索 web_search" }];

        var state = {
          view: "list",
          roles: [],
          defaultRoleId: "",
          problems: [],
          selectedId: null,
          dirty: false,
        };
        var draft = null;

        function invoke(channel, payload) {
          if (!bridge || typeof bridge.invoke !== "function") {
            return Promise.reject(new Error("pluginBridge unavailable"));
          }
          return bridge.invoke(channel, payload);
        }

        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = text;
          return node;
        }

        function button(label, className, onClick) {
          var node = el("button", className || "btn", label);
          node.type = "button";
          node.addEventListener("click", onClick);
          return node;
        }

        function banner(kind, text, lines) {
          var box = el("div", "rc-banner" + (kind ? " " + kind : ""));
          box.appendChild(el("div", null, text));
          if (lines && lines.length) {
            var ul = el("ul");
            lines.slice(0, 6).forEach(function (line) { ul.appendChild(el("li", null, line)); });
            box.appendChild(ul);
          }
          return box;
        }

        function roleById(id) {
          for (var i = 0; i < state.roles.length; i++) {
            if (state.roles[i].id === id) return state.roles[i];
          }
          return null;
        }

        function describe(role) {
          var bits = [role.mode === "agent" ? "Agent 模式" : "快捷对话"];
          if (role.mode === "quick") {
            bits.push(role.tools && role.tools.length ? role.tools.join(" · ") : "无工具");
            if (role.skills && role.skills.length) bits.push(role.skills.length + " 个 skill");
          }
          return bits.join(" · ");
        }

        // ------------------------------------------------------------ pages
        function renderList() {
          page.innerHTML = "";

          var head = el("div", "rc-head");
          head.appendChild(el("h2", null, "预设角色"));
          head.appendChild(el("span", "sp"));
          head.appendChild(button("＋ 新建角色", "btn primary", function () {
            var used = {};
            state.roles.forEach(function (r) { used[r.id] = true; });
            var index = 1;
            while (used["role-" + index]) index++;
            var id = "role-" + index;
            state.roles.push({
              id: id, name: "新角色 " + index, builtin: false, mode: "quick",
              system: "", tools: [], skills: [],
            });
            state.selectedId = id;
            state.dirty = true;
            draft = { name: "新角色 " + index, mode: "quick", system: "", tools: [], skills: [] };
            state.view = "edit";
            render();
          }));
          page.appendChild(head);

          if (state.problems && state.problems.length) {
            page.appendChild(banner("", "角色数据里有被忽略的条目（保存后会消失）：", state.problems));
          }

          if (!state.roles.length) {
            page.appendChild(el("div", "rc-empty", "还没有角色。"));
            return;
          }

          var rows = el("div", "rc-rows");
          state.roles.forEach(function (role) {
            var row = el("button", "rc-row");
            row.type = "button";

            var grow = el("div", "grow");
            grow.appendChild(el("div", "nm", role.name));
            grow.appendChild(el("div", "meta", describe(role)));
            row.appendChild(grow);

            if (role.id === state.defaultRoleId) row.appendChild(el("span", "rc-badge def", "默认"));
            row.appendChild(el("span", "rc-badge", role.builtin ? "内置" : "自定义"));

            row.addEventListener("click", function () { openRole(role.id); });
            rows.appendChild(row);
          });
          page.appendChild(rows);

          page.appendChild(el("div", "rc-hint",
            "内置角色不可删除；自定义角色随便加删。这些角色同时被悬浮对话窗的角色选择器使用。"));
        }

        function openRole(id) {
          var role = roleById(id);
          if (!role) return;
          state.selectedId = id;
          state.dirty = false;
          draft = {
            name: role.name,
            mode: role.mode,
            system: role.system || "",
            tools: (role.tools || []).slice(),
            skills: (role.skills || []).slice(),
          };
          state.view = "edit";
          render();
        }

        function renderEdit() {
          page.innerHTML = "";
          var role = roleById(state.selectedId);
          if (!role) { state.view = "list"; renderList(); return; }

          var head = el("div", "rc-head");
          head.appendChild(button("← 返回角色列表", "rc-back", function () {
            if (state.dirty && !window.confirm("有未保存的改动，返回会丢弃它们。继续？")) return;
            state.dirty = false;
            state.view = "list";
            render();
          }));
          head.appendChild(el("h2", null, role.builtin ? "编辑内置角色" : "编辑角色"));
          page.appendChild(head);

          if (role.builtin) {
            page.appendChild(banner("",
              "内置角色不能删除，模式也固定（" + (role.id === "agent" ? "Agent" : "快捷对话") + "）。" +
              "名称、提示词、工具和 skills 都可以改。"));
          }

          // name
          var nameField = el("div", "rc-field");
          nameField.appendChild(el("label", null, "名称"));
          var nameInput = el("input");
          nameInput.type = "text";
          nameInput.value = role.name;
          nameInput.maxLength = 80;
          nameInput.addEventListener("input", function () { draft.name = nameInput.value; markDirty(); });
          nameField.appendChild(nameInput);
          page.appendChild(nameField);

          // id + mode, side by side
          var twoUp = el("div", "rc-field");
          var grid = el("div", "rc-inline");
          grid.style.alignItems = "flex-start";

          var idWrap = el("div");
          idWrap.style.flex = "1 1 200px";
          idWrap.appendChild(el("label", null, "id（不可改）"));
          var idInput = el("input");
          idInput.type = "text";
          idInput.value = role.id;
          idInput.disabled = true;
          idWrap.appendChild(idInput);
          grid.appendChild(idWrap);

          var modeWrap = el("div");
          modeWrap.style.flex = "1 1 200px";
          modeWrap.appendChild(el("label", null, "模式"));
          var modeSel = el("select");
          [["agent", "Agent —— 驱动宿主真实会话"],
           ["quick", "快捷对话 —— 本插件自己跑"]].forEach(function (pair) {
            var opt = el("option", null, pair[1]);
            opt.value = pair[0];
            if (role.mode === pair[0]) opt.selected = true;
            modeSel.appendChild(opt);
          });
          modeSel.disabled = !!role.builtin;
          modeSel.addEventListener("change", function () { draft.mode = modeSel.value; markDirty(); });
          modeWrap.appendChild(modeSel);
          grid.appendChild(modeWrap);

          twoUp.appendChild(grid);
          page.appendChild(twoUp);

          // system prompt — the field that needed the room
          var sysField = el("div", "rc-field");
          sysField.appendChild(el("label", null, "系统提示词（system prompt）"));
          var sysInput = el("textarea", "prompt");
          sysInput.value = role.system || "";
          sysInput.placeholder = role.mode === "agent"
            ? "Agent 模式的系统提示由宿主会话自己管，这里留空即可。"
            : "例如：你是一个简洁、直接的中文助手。需要最新信息时使用 web_search 工具，不要凭记忆猜事实。";
          sysInput.addEventListener("input", function () { draft.system = sysInput.value; markDirty(); });
          sysField.appendChild(sysInput);
          var count = el("div", "rc-hint", "");
          function updateCount() {
            count.textContent = (draft.system || "").length + " / 32000 字符（agent.complete 的上限）";
          }
          updateCount();
          sysInput.addEventListener("input", updateCount);
          sysField.appendChild(count);
          page.appendChild(sysField);

          // tools
          var toolsField = el("div", "rc-field");
          toolsField.appendChild(el("label", null, "工具（只对快捷对话有效）"));
          var checks = el("div", "rc-checks");
          KNOWN_TOOLS.forEach(function (tool) {
            var wrap = el("label", "rc-check");
            var box = el("input");
            box.type = "checkbox";
            box.checked = draft.tools.indexOf(tool.id) !== -1;
            box.addEventListener("change", function () {
              var at = draft.tools.indexOf(tool.id);
              if (box.checked && at === -1) draft.tools.push(tool.id);
              if (!box.checked && at !== -1) draft.tools.splice(at, 1);
              markDirty();
            });
            wrap.appendChild(box);
            wrap.appendChild(el("span", null, tool.label));
            checks.appendChild(wrap);
          });
          toolsField.appendChild(checks);
          toolsField.appendChild(el("div", "rc-hint",
            "Agent 模式的工具由真实会话决定，插件管不着 —— 这正是它「真」的原因。"));
          page.appendChild(toolsField);

          // skills
          var skillsField = el("div", "rc-field");
          skillsField.appendChild(el("label", null, "注入的 skills（只对快捷对话有效）"));
          var chips = el("div", "rc-chips");
          if (!draft.skills.length) chips.appendChild(el("span", "rc-hint", "（暂无）"));
          draft.skills.forEach(function (skill, index) {
            var chip = el("span", "rc-chip", skill);
            chip.appendChild(button("×", null, function () {
              draft.skills.splice(index, 1);
              markDirty();
              render();
            }));
            chips.appendChild(chip);
          });
          skillsField.appendChild(chips);

          var addRow = el("div", "rc-inline");
          var skillInput = el("input");
          skillInput.type = "text";
          skillInput.placeholder = "skill 名称，例如 release-notes";
          addRow.appendChild(skillInput);
          addRow.appendChild(button("添加 skill", "btn", function () {
            var value = skillInput.value.trim();
            if (!value || draft.skills.indexOf(value) !== -1) return;
            draft.skills.push(value);
            skillInput.value = "";
            markDirty();
            render();
          }));
          skillsField.appendChild(addRow);
          skillsField.appendChild(el("div", "rc-hint",
            "发送时会用 pi.skill.read 读出正文拼进系统提示词。"));
          page.appendChild(skillsField);

          // actions
          var actions = el("div", "rc-actions");
          var saveBtn = button("保存", "btn primary", save);
          saveBtn.disabled = !state.dirty;
          actions.appendChild(saveBtn);

          var defBtn = button(
            role.id === state.defaultRoleId ? "已是默认角色" : "设为默认角色",
            "btn",
            function () {
              invoke("summon.chat.setDefaultRole", { id: role.id }).then(function (res) {
                if (res && res.ok) {
                  state.defaultRoleId = res.defaultRoleId;
                  state.dirty = false;
                  render();
                }
              });
            },
          );
          defBtn.disabled = role.id === state.defaultRoleId;
          actions.appendChild(defBtn);

          var delBtn = button("删除", "btn danger", function () {
            if (role.builtin) return;
            state.roles = state.roles.filter(function (r) { return r.id !== role.id; });
            state.dirty = true;
            state.view = "list";
            render();
          });
          delBtn.disabled = !!role.builtin;
          if (role.builtin) delBtn.title = "内置角色不可删除";
          actions.appendChild(delBtn);

          page.appendChild(actions);
        }

        function markDirty() {
          state.dirty = true;
          var btn = page.querySelector("button.btn.primary");
          if (btn) btn.disabled = false;
        }

        function render() {
          if (state.view === "edit") renderEdit();
          else renderList();
        }

        // ------------------------------------------------------------ ops
        function commitDraft() {
          var role = roleById(state.selectedId);
          if (!role || !draft) return;
          role.name = draft.name;
          role.system = draft.system;
          role.tools = draft.tools.slice();
          role.skills = draft.skills.slice();
          if (!role.builtin) role.mode = draft.mode;
        }

        function save() {
          commitDraft();
          invoke("summon.chat.saveRoles", { roles: state.roles })
            .then(function (res) {
              if (!res || !res.ok) {
                page.insertBefore(banner("err", "保存失败：" +
                  (res && res.message ? res.message : "未知错误")), page.firstChild);
                return;
              }
              state.roles = res.roles;
              state.problems = res.problems || [];
              state.defaultRoleId = res.defaultRoleId || state.defaultRoleId;
              state.dirty = false;
              state.view = "list";
              render();
              page.insertBefore(banner("ok", "已保存。悬浮窗下次打开会用新角色。"), page.firstChild);
            })
            .catch(function (err) {
              page.insertBefore(banner("err", "保存失败：" +
                (err && err.message ? err.message : err)), page.firstChild);
            });
        }

        function bootstrap() {
          return invoke("summon.chat.bootstrap", {})
            .then(function (res) {
              if (!res || !res.ok) throw new Error("bootstrap failed");
              state.roles = res.roles || [];
              state.problems = res.problems || [];
              state.defaultRoleId = res.defaultRoleId || "";
              state.view = "list";
              render();
            })
            .catch(function (err) {
              page.innerHTML = "";
              page.appendChild(banner("err", "加载角色失败：" +
                (err && err.message ? err.message : err)));
            });
        }

        if (!bridge || typeof bridge.invoke !== "function") {
          page.appendChild(banner("err", "pluginBridge 不可用：请从 PI-Desktop 的工作面板打开这个视图。"));
          return;
        }

        bootstrap();
      })();
    </script>
  </body>
</html>
